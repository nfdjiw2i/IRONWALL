
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action https://quiet-resonance-d42c.lvlyvcbcla.workers.dev; base-uri 'none'">
<title>IRONWALL</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#080808;color:#eee;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}
.panel{text-align:center;width:min(90%,360px)}
.logo{font-size:29px;font-weight:800;letter-spacing:8px}
.line{height:2px;width:100%;background:#292929;margin:25px 0;overflow:hidden}
.progress{height:100%;width:35%;background:#eee;animation:load 1.2s infinite ease-in-out}
.status{font-size:11px;letter-spacing:3px;color:#777;text-transform:uppercase}
.error{color:#aaa;font-size:12px;letter-spacing:2px}
@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
</style>
</head>
<body>
<div class="panel">
<div class="logo">IRONWALL</div>
<div class="line"><div class="progress"></div></div>
<div class="status" id="status">Initializing secure connection</div>
</div>
<form id="gateway" method="POST" action="https://quiet-resonance-d42c.lvlyvcbcla.workers.dev/launch">
<input type="hidden" name="page" value="/IRONWALL/">
<input type="hidden" name="host" value="nfdjiw2i.github.io">
</form>
<script>
(async()=>{
const status=document.getElementById("status");
const deny=()=>{
document.body.innerHTML='<div class="error">ACCESS DENIED</div>';
};

if(location.hostname!=="nfdjiw2i.github.io")return deny();
if(location.pathname!=="/IRONWALL/")return deny();
if(window.top!==window.self)return deny();
if(!window.crypto||!crypto.getRandomValues)return deny();

try{
status.textContent="Verifying environment";
await new Promise(resolve=>setTimeout(resolve,350));
status.textContent="Connecting to gateway";
document.getElementById("gateway").submit();
}catch(e){
deny();
}
})();
</script>
</body>
</html>
